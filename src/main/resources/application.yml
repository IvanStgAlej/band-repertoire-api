spring:
  application:
    name: band-repertoire-api
  datasource:
    url: jdbc:h2:mem:repertoire;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Loads lazy associations of a page in batches instead of one query per row (avoids N+1).
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration,classpath:db/demo
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
